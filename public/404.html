<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>simbirsoft-learning-project</title>
    <script>
      // SPA fallback for GitHub Pages: encode the requested path into the
      // query string and redirect to the project root, where index.html
      // decodes it back into a real route via history.replaceState.
      (function () {
        var segmentCount = 1;
        var l = window.location;
        l.replace(
          l.protocol +
            "//" +
            l.hostname +
            (l.port ? ":" + l.port : "") +
            l.pathname
              .split("/")
              .slice(0, 1 + segmentCount)
              .join("/") +
            "/?/" +
            l.pathname
              .slice(1)
              .split("/")
              .slice(segmentCount)
              .join("/")
              .replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash,
        );
      })();
    </script>
  </head>
  <body></body>
</html>
